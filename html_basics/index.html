<!-- commenting is done by < symbol followed by a exclamation mark and 2 hyphens , then 2 hyphens and > symbol -->
<!-- this is the standard , declaring the type of file -->
<!DOCTYPE html>

<!-- declared the html tag , everything will go between this tag -->
<html>
    <!-- using indentation so it is human readable , declared the head - where the title goes-->
    <head>
        <!-- title tag , this will be what displays on the browser -->
        <title>  html basics home page </title>
    </head>
    <!-- keeping indentation so it can be read , body tag declared -->
    <body>
    <!-- these are the headers for the body -->
    <h1>  this is h1 </h1>
    <!-- this is the paragraph tag which will make up the bulk of the tet in a webpage -->
    <p>   this is paragraph 1 in my webpage  </p>
    <!-- this hr tag is a horizontal rule which puts a line on the webpage to separate parts -->
    <hr>

    <h2>  this is h2 </h2>
    <!-- id only happens when 1 thing needs to be uniquelly identified , use only once -->
    <p id= "index"> this is paragraph 2 in my webpage </p>
    <h3>  this is h3 </h3>
    <!-- multiple things that needs to be similar to each other -->
    <p class="notdex"> this is paragraph 3 in my webpage</p>
    <!-- creates empty space between content , break -->
    <br>
    <!-- always use strong rather than bold since you can do more -->
    <strong> this is strong </strong>

    <!-- very limited just bolds but limited in styling -->
    <b> this is bold </b>
    <!-- use for the br tag see on webpage -->
    <br>
    <!-- allows way more control of what is possible to do , always use em over italics -->
    <em> this em </em>
    <!-- just does italics very limited like bold -->
    <i> this is i </i>

    <h4>  this is h4 </h4>
    <h5>  this is h5 </h5>
    <h6>  this is h6 </h6>



    </body>
</html>
